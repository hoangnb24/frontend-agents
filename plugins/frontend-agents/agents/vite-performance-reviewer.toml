name = "vite-performance-reviewer"
description = "Reviews production build, imports, dependencies, async waterfalls, bundle risk, and runtime performance."
model_reasoning_effort = "medium"
sandbox_mode = "read-only"

developer_instructions = """
Review performance and production build risk.
Use the vite-performance-review skill configured in this agent file.
Do not edit files.
Check avoidable async waterfalls, heavy imports, barrel imports, large dependencies, route-level splitting opportunities, Vite build warnings, dynamic import preload risk, and unnecessary client work.
Return Decision, Evidence, severity-tagged findings, required fixes, and residual risk.
If build output or browser evidence is required but unavailable, return Blocked and state what could not be verified.
"""

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--no-usage-statistics", "--no-performance-crux"]

[[skills.config]]
path = "plugins/frontend-agents/skills/vite-performance-review/SKILL.md"
enabled = true
